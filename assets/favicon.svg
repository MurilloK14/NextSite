<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="nsBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F142A" />
      <stop offset="65%" stop-color="#070614" />
      <stop offset="100%" stop-color="#030208" />
    </radialGradient>

    <!-- Core Ambient Cyan Glow -->
    <radialGradient id="nsCoreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Tech Border -->
    <linearGradient id="nsRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Letter N Gradient (Pure White with subtle depth) -->
    <linearGradient id="whiteNGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Letter S Gradient (Electric Sky to Tech Blue) -->
    <linearGradient id="blueSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00D2FF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Disc -->
  <circle cx="256" cy="256" r="244" fill="url(#nsBg)" />

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#nsCoreGlow)" />

  <!-- Outer Tech Gradient Ring -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#nsRing)" stroke-width="11" />

  <!-- Inner Specular Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" />

  <!-- Monogram NS -->
  <g filter="url(#monogramShadow)">
    <text x="253" y="322" text-anchor="middle" font-family="'Segoe UI Black', 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="192" font-weight="900" letter-spacing="-6">
      <tspan fill="url(#whiteNGrad)" dx="-4">N</tspan><tspan fill="url(#blueSGrad)" dx="8">S</tspan>
    </text>
  </g>

  <!-- Cyber Accent Spark Dot -->
  <circle cx="405" cy="137" r="17" fill="#00E5FF" opacity="0.3" />
  <circle cx="405" cy="137" r="9" fill="#00F0FF" />
</svg>
